<details class="fr-privacy" id="privacy-settings">
  <summary data-fr-i18n-zh="隐私设置" data-fr-i18n-en="Privacy settings">隐私设置</summary>
  <p data-fr-i18n-zh="访问统计默认关闭。选择只保存在此浏览器、此域名下，随时可以撤回。" data-fr-i18n-en="Analytics is off by default. Your choice stays in this browser for this domain and can be withdrawn here.">访问统计默认关闭。选择只保存在此浏览器、此域名下，随时可以撤回。</p>
  <form data-fr-privacy-form data-fr-analytics-configured="{% if jekyll.environment == 'production' and site.analytics.provider == 'google-gtag' and site.analytics.google.tracking_id %}true{% else %}false{% endif %}">
    <input type="checkbox" id="fr-analytics-consent" name="analytics" disabled>
    <label for="fr-analytics-consent" data-fr-i18n-zh="允许 Google Analytics 访问统计" data-fr-i18n-en="Allow Google Analytics usage statistics">允许 Google Analytics 访问统计</label>
    <button type="submit" class="btn" disabled data-fr-i18n-zh="保存并刷新" data-fr-i18n-en="Save and reload">保存并刷新</button>
    <p data-fr-privacy-status role="status" aria-live="polite"></p>
  </form>
  <noscript>访问统计已关闭 / Analytics is off.</noscript>
  <a href="{{ '/terms/' | relative_url }}" data-fr-i18n-zh="阅读条款与隐私说明" data-fr-i18n-en="Read terms and privacy details">阅读条款与隐私说明</a>
</details>
