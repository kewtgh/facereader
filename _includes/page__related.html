{% assign locale = include.locale | default: page.locale | default: site.locale %}
{% if page.related_articles.size > 0 %}
<div class="page__related">
  <h2 class="page__related-title" data-fr-i18n-zh="{{ site.data.ui-text['zh-CN'].related_label }}" data-fr-i18n-en="{{ site.data.ui-text.en.related_label }}">{{ site.data.ui-text[locale].related_label }}</h2>
  <div class="grid__wrapper">
    {% for post in page.related_articles %}
      {% include archive-single.html locale=locale type="grid" %}
    {% endfor %}
  </div>
</div>
{% endif %}
