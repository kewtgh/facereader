{% assign locale = include.locale | default: site.locale %}
<div class="search-content__inner-wrap">
  <p><a href="{{ '/search/' | relative_url }}" data-fr-i18n-zh="使用站内文章搜索" data-fr-i18n-en="Use local article search">使用站内文章搜索</a> · <a href="{{ '/reading-list/' | relative_url }}" data-fr-i18n-zh="稍后阅读" data-fr-i18n-en="Reading list">稍后阅读</a></p>
  {%- assign search_provider = site.search_provider | default: "lunr" -%}
  {%- case search_provider -%}
  {%- when "lunr" -%}
  <form class="search-content__form" onkeydown="return event.key != 'Enter';" role="search">
    <label class="sr-only" for="search">
      <span data-fr-i18n-key="search_label_text">{{ site.data.ui-text[locale].search_label_text | default: 'Enter your search term...' }}</span>
    </label>
    <input type="search" id="search" class="search-input" tabindex="-1" placeholder="{{ site.data.ui-text[locale].search_placeholder_text | default: 'Enter your search term...' }}" data-fr-i18n-placeholder-key="search_placeholder_text" />
  </form>
  <div id="results" class="results"></div>
  {%- when "google" -%}
  <form onsubmit="return googleCustomSearchExecute();" id="cse-search-box-form-id" role="search">
    <label class="sr-only" for="cse-search-input-box-id">
      <span data-fr-i18n-key="search_label_text">{{ site.data.ui-text[locale].search_label_text | default: 'Enter your search term...' }}</span>
    </label>
    <input type="search" id="cse-search-input-box-id" class="search-input" tabindex="-1" placeholder="{{ site.data.ui-text[locale].search_placeholder_text | default: 'Enter your search term...' }}" data-fr-i18n-placeholder-key="search_placeholder_text" />
  </form>
  <div id="results" class="results">
    <gcse:searchresults-only></gcse:searchresults-only>
  </div>
  {%- when "algolia" -%}
  <div class="algolia-page">
    <div class="algolia-searchbox"></div>
    <div class="algolia-stats" role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="algolia-hits"></div>
    <div class="algolia-pagination"></div>
  </div>
  {%- endcase -%}
</div>
